version: '3.8'

services:
  # 1. AI Vision Pipeline & 3-Node Blockchain Authority Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ibvap-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FRONTEND_URL=http://frontend:3000
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist 3-node blockchain ledgers and audit records across restarts
      - ./blockchain_data:/app/blockchain_data
      # Persist captured intrusion frames and forensic snapshots
      - ./evidence:/app/evidence
      # Video input feeds and processed surveillance outputs
      - ./video:/app/video
    networks:
      - ibvap-network

  # 2. Modern React / TanStack Start Web Command Center
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibvap-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - ibvap-network

  # 3. Production Nginx Reverse Proxy (Unified port 80 entrypoint)
  nginx:
    image: nginx:alpine
    container_name: ibvap-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ibvap-network

networks:
  ibvap-network:
    driver: bridge
