# =====================================================================
# Cloudflare Named Tunnel Configuration for IBVAP
# =====================================================================
# Routes all public HTTPS traffic through Caddy reverse proxy:
# Internet -> Cloudflare (HTTPS) -> Cloudflare Tunnel -> Caddy (:8080 or :80)
#
# Caddy then routes internally:
#   /api/*      --> Backend (Port 5000 / 5001)
#   /video/*    --> Backend (Port 5000 / 5001 - unbuffered MJPEG)
#   /evidence/* --> Backend (Port 5000 / 5001)
#   /health     --> Backend (Port 5000 / 5001)
#   /*          --> Frontend (Port 3000 - React 19 SSR)

tunnel: ${TUNNEL_ID}
credentials-file: ~/.cloudflared/${TUNNEL_ID}.json

ingress:
  # Primary route to Caddy Unified Reverse Proxy (Host port 8080 or Docker caddy:80)
  - hostname: ${DOMAIN_NAME}
    service: http://127.0.0.1:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Fallback rule (Required by Cloudflare Tunnel)
  - service: http_status:404
