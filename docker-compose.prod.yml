version: '3.8'

services:
  # 1. AI Vision Pipeline & 3-Node Blockchain Authority Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ibvap-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FRONTEND_URL=http://frontend:3000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist 3-node blockchain ledgers and audit records across restarts
      - ./blockchain_data:/app/blockchain_data
      # Persist captured intrusion frames and forensic snapshots
      - ./evidence:/app/evidence
      # Video input feeds
      - ./video:/app/video
      # Processed annotated surveillance outputs
      - ./ai_pipeline/output:/app/ai_pipeline/output
      # Cryptographic camera identities and keys
      - ./security:/app/security
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ibvap-network

  # 2. Modern React 19 / TanStack Start Web Command Center
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ibvap-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - VITE_BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ibvap-network

  # 3. High-Performance Caddy Production Reverse Proxy (Unified Port 80 Entrypoint)
  caddy:
    image: caddy:alpine
    container_name: ibvap-caddy
    restart: unless-stopped
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - BACKEND_TARGET=http://backend:5000
      - FRONTEND_TARGET=http://frontend:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - ibvap-network

  # 4. Optional Cloudflare Named Tunnel (Active with --profile with-tunnel)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ibvap-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks:
      - ibvap-network
    profiles:
      - with-tunnel

networks:
  ibvap-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
