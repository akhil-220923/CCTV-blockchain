services:
  - type: web
    name: sih-182-tracevasp
    env: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
